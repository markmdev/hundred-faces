<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>A hundred faces</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='29' fill='%23ffd666' stroke='%232a2a28' stroke-width='2'/%3E%3Ccircle cx='22' cy='27' r='3.6' fill='%232a2a28'/%3E%3Ccircle cx='42' cy='27' r='3.6' fill='%232a2a28'/%3E%3Cpath d='M20 44 Q32 56 44 44' fill='none' stroke='%232a2a28' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="/src/client/style.css" />
  </head>
  <body>
    <main class="app">
      <header class="intro">
        <h1>A hundred faces</h1>
        <p>
          Type anything. One hundred people react while you type, each judged on their own by
          TypeSafe AI's Jev: four hundred questions, one round trip.
        </p>
      </header>

      <section class="composer">
        <label class="visually-hidden" for="message">Message</label>
        <textarea
          id="message"
          rows="3"
          placeholder="A tweet, a price-increase announcement, a product name, a headline, a text to a friend…"
          autofocus
        ></textarea>
        <div class="presets" id="presets" role="group" aria-label="Preset messages"></div>
      </section>

      <section class="summary" aria-live="polite">
        <div class="stats">
          <span class="stat"><strong id="stat-latency">–</strong> ms</span>
          <span class="stat"><strong id="stat-tokens">–</strong> input tokens</span>
          <span class="stat" id="stat-calls"></span>
          <span class="status" id="status"></span>
        </div>
        <div class="reaction-bar" id="reaction-bar" aria-label="Reaction mix across all faces"></div>
        <ul class="legend" id="legend"></ul>
        <ul class="nouls" id="nouls"></ul>
      </section>

      <section class="wall" id="wall" aria-label="One hundred faces"></section>

      <div class="tooltip" id="tooltip" role="tooltip" hidden></div>
    </main>
    <script type="module" src="/src/client/main.ts"></script>
  </body>
</html>
